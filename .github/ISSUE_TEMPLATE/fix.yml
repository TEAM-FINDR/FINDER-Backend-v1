name: 수정 작업
description: 확인된 결함이나 누락을 바로잡는 작업을 등록합니다.
title: "[Fix]: "
labels: ["fix"]
body:
  - type: textarea
    id: current
    attributes:
      label: 현재 문제
      description: 수정이 필요한 동작이나 누락을 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: desired
    attributes:
      label: 수정 후 기대 동작
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: input
    id: related
    attributes:
      label: 관련 이슈 또는 명세
      placeholder: "#123 또는 기능 명세 ID"
