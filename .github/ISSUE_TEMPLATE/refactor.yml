name: 리팩터링
description: 외부 동작을 바꾸지 않는 코드 구조 개선 작업을 등록합니다.
title: "[Refactor]: "
labels: ["리팩터링"]
body:
  - type: textarea
    id: motivation
    attributes:
      label: 개선 이유
      description: 현재 구조의 비용이나 위험을 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 영향을 받는 모듈과 제안하는 구조 변경을 적어주세요.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 유지해야 할 동작
      description: 변경 후에도 동일해야 하는 API와 동작을 적어주세요.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      placeholder: |
        - [ ] 외부 동작이 유지된다.
        - [ ] ...
    validations:
      required: true
